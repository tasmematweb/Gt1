:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1c;--tx:#eee;--mut:#9a9a9a;--bd:#333;--hd:#1a1a1a;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;max-width:900px;margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.brand{cursor:pointer}.logo{margin:0;color:var(--ac)}.acts{display:flex}
.ib{background:none;border:0;color:var(--ac);font-size:26px;padding:4px 8px;cursor:pointer}
#nav{display:none;background:var(--hd);border-bottom:1px solid var(--bd);padding:8px 12px;flex-wrap:wrap;gap:8px}
#nav.on{display:flex}
#nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;cursor:pointer;font:inherit}
#nav button.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
#sb{display:none;padding:8px 12px}#sb.on{display:block}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:180px;resize:vertical}
.tk{background:var(--hd);border-bottom:1px solid var(--bd);display:none;align-items:center;gap:10px;padding:8px 12px;white-space:nowrap;overflow:hidden}
.tk b{background:var(--ac);color:#fff;padding:2px 10px;border-radius:4px;font-size:13px;flex:none}
.tk span{overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sl{position:relative;background:#000;margin:10px 8px;aspect-ratio:16/10;overflow:hidden}
.sl img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.sl .cp{position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.88);color:#111;padding:8px 12px;font-weight:700;font-size:18px;cursor:pointer}
.sl .ar{position:absolute;top:40%;background:#000;color:#fff;border:0;width:40px;height:50px;font-size:22px;cursor:pointer}
.dots{background:#000;text-align:center;padding:8px;margin:-10px 8px 10px}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;margin:0 8px;cursor:pointer}
.dots i.on{background:var(--ac)}
.sec{background:#2b2b2b;color:#fff;border-bottom:3px solid var(--ac);padding:8px 14px;font-size:20px;font-weight:700;margin:10px 12px}
.big,.row{background:var(--card);border:1px solid var(--bd);margin:0 12px 12px;cursor:pointer}
.big img{width:100%;max-height:340px;object-fit:cover;display:block;padding:6px}
.big h3{color:#9b1111;font-size:22px;margin:8px 14px}
.row{display:flex;flex-direction:row;gap:0;align-items:stretch}
.row img{width:36%;max-height:150px;object-fit:cover;padding:6px;flex:none}
.row .t{padding:8px 12px;flex:1}
.row h3{font-size:17px;margin:0 0 6px}
.meta{color:var(--mut);font-size:13px}
.tag{background:var(--ac);color:#fff;border-radius:4px;padding:0 8px;font-size:12px;margin-inline-start:6px}
.art{padding:0 14px}
.bc{color:var(--ac);margin:12px 0;cursor:pointer}
.art h1{color:var(--ac);font-size:24px;margin:8px 0}
.art img{width:100%;display:block;border:1px solid var(--bd);padding:6px}
.art .by{color:var(--ac);font-weight:700;margin-top:12px}
.art .bd p{text-align:justify;font-size:18px;line-height:2;margin:8px 0}
.art .bd h2{color:var(--ac);text-decoration:underline;font-size:20px;margin:20px 0 4px}
.sh{display:flex;gap:8px;margin:14px 0}
.sh a{flex:1;text-align:center;color:#fff;border-radius:8px;padding:10px 4px;text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:40px 0}
button.p{font:inherit;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;background:var(--ac);color:#fff}
button.g{font:inherit;background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.5}
#admin{display:none;margin:12px;padding:14px;border:2px dashed var(--ac);border-radius:8px}
#admin h3{margin:0 0 10px}
#prev{max-width:180px;display:none;margin-bottom:10px;border-radius:6px}
footer{text-align:center;padding:20px 16px 90px;border-top:1px solid var(--bd);margin-top:20px}
footer .msg{display:block;margin-top:8px;font-size:13px;color:var(--mut)}
.fl{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;background:var(--ac);color:#fff;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;opacity:0;pointer-events:none;transition:opacity .25s}
.fl.show{opacity:.92;pointer-events:auto}
.logo,.sec,.big h3,.row h3,.art h1,.art .bd h2,#nav button,.tk b,.sl .cp,.bc{font-family:"Lalezar","Segoe UI",Tahoma,Arial,sans-serif;font-weight:400}
.logo{font-size:22px}.sec{font-size:24px}.big h3{font-size:25px}.row h3{font-size:20px}.art h1{font-size:28px;line-height:1.5}.art .bd h2{font-size:23px}.sl .cp{font-size:21px}
.hero{text-align:center;padding:14px 0 8px;background:var(--hd);border-bottom:1px solid var(--bd);cursor:pointer}
.hero img{width:200px;height:200px;border-radius:50%;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.22)}
#sg{display:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:65vh;overflow:auto;margin-top:-4px}
#sg.on{display:block}
.si{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.si img{width:72px;height:54px;object-fit:cover;flex:none}
.si .st{font-family:"Lalezar","Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.5}
mark{background:var(--ac);color:#fff;padding:0 3px;border-radius:3px}
.sall{text-align:center;padding:10px;color:var(--ac);font-weight:700;cursor:pointer}
.ib svg,.fl svg{display:block}
.ar{display:flex;align-items:center;justify-content:center}
input[type=password]{width:100%;font:inherit;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:180px;resize:vertical}
#prev{max-width:180px;display:none;margin-bottom:10px;border-radius:6px}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const IC={sun:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
const root=document.documentElement;
const curDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function setT(t){root.dataset.theme=t;$('th').innerHTML=t==='dark'?IC.sun:IC.moon;try{localStorage.setItem('th',t)}catch(e){}}
try{const t=localStorage.getItem('th');if(t)root.dataset.theme=t}catch(e){}
$('th').innerHTML=curDark()?IC.sun:IC.moon;
$('th').onclick=()=>setT(curDark()?'light':'dark');
const SECS=['الكل','أخبار عاجلة','سياسة','اقتصاد','رياضة','كرة عالمية','حوادث','فن'];
let isAdmin=false,adminOpen=false,assets=null,db=null,items=[],file=null,sec='الكل',q='',si=0,timer=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleString('ar-EG',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const src=i=>i.img?esc(i.img):'';
$('nav').innerHTML=SECS.map(s=>`<button data-s="${s}">${s}</button>`).join('');
$('nav').onclick=e=>{const s=e.target.dataset.s;if(!s)return;sec=s;location.hash='';render()};
$('mb').onclick=()=>$('nav').classList.toggle('on');
$('sbtn').onclick=()=>{$('sb').classList.toggle('on');if($('sb').classList.contains('on'))$('q').focus()};
const hl=(t,v)=>esc(t).split(esc(v)).join('<mark>'+esc(v)+'</mark>');
function sug(){
  const v=$('q').value.trim(),g=$('sg');
  if(!v){g.className='';g.innerHTML='';return}
  const r=items.filter(i=>(i.title+' '+i.body).includes(v));
  g.className='on';
  g.innerHTML=r.length?r.slice(0,6).map(i=>`<div class="si" data-go="${esc(i.id)}">${i.img?`<img src="${src(i)}" alt="">`:''}<div><div class="st">${hl(i.title,v)}</div><div class="meta">${fd(i.ts)}</div></div></div>`).join('')+`<div class="sall" data-all="1">عرض كل النتائج (${r.length})</div>`:'<div class="si">لا توجد نتائج مطابقة</div>';
}
function applySearch(){q=$('q').value.trim();$('sg').className='';location.hash='';render()}
$('q').oninput=sug;
$('q').onkeydown=e=>{if(e.key==='Enter')applySearch()};
$('sg').onclick=e=>{
  const g=e.target.closest('[data-go]');
  if(g){$('sg').className='';$('sb').classList.remove('on');location.hash=g.dataset.go;return}
  if(e.target.closest('[data-all]'))applySearch();
};
$('lg').onclick=$('home').onclick=()=>{sec='الكل';q='';$('q').value='';location.hash='';render();scrollTo(0,0)};
addEventListener('scroll',()=>{const on=scrollY>250;$('home').classList.toggle('show',on);$('up').classList.toggle('show',on)},{passive:true});
$('up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
window.onhashchange=()=>{$('sg').className='';render();scrollTo(0,0)};
function body(t){return String(t||'').split(/\n+/).filter(Boolean).map(l=>l.startsWith('## ')?`<h2>${esc(l.slice(3))}</h2>`:`<p>${esc(l)}</p>`).join('')}
function slide(){
  const L=items.filter(i=>i.img).slice(0,4);if(!L.length)return'';
  si%=L.length;const i=L[si];
  return `<div class="sl"><img src="${src(i)}" alt="" data-go="${esc(i.id)}"><div class="cp" data-go="${esc(i.id)}">${esc(i.title)}</div>
  <button class="ar" style="inset-inline-start:0" data-d="1"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><button class="ar" style="inset-inline-end:0" data-d="-1"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="dots">${L.map((_,k)=>`<i class="${k==si?'on':''}" data-k="${k}"></i>`).join('')}</div>`;
}
function del(i){return isAdmin&&adminOpen?`<button class="g" data-del="${esc(i.id)}" style="margin:0 12px 8px">حذف</button>`:''}
function render(){
  clearInterval(timer);
  [...$('nav').children].forEach(b=>b.classList.toggle('cur',b.dataset.s===sec));
  const brk=items.find(i=>i.breaking);
  $('tk').style.display=brk?'flex':'none';
  if(brk){$('tkt').textContent=brk.title;$('tkt').onclick=()=>{location.hash=brk.id}}
  const v=$('view'),id=location.hash.slice(1),a=items.find(i=>i.id===id);
  if(id&&a){
    const u=encodeURIComponent(location.href),tt=encodeURIComponent(a.title);
    v.innerHTML=`<div class="art"><div class="bc" onclick="location.hash=''">الرئيسية <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M15 6l-6 6 6 6"/></svg> ${esc(a.section||'أخبار')}</div>
    <h1>${esc(a.title)}</h1>${a.img?`<img src="${src(a)}" alt=""><div class="meta" style="text-align:center;padding:6px">${esc(a.cap)}</div>`:''}
    <div class="sh"><a style="background:#1a55b8" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">فيسبوك</a>
    <a style="background:#12702d" target="_blank" rel="noopener" href="https://wa.me/?text=${tt}%20${u}">واتساب</a>
    <a style="background:#000" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${tt}&url=${u}">X</a></div>
    ${a.author?`<div class="by">كتب - ${esc(a.author)}</div>`:''}<div class="meta">${fd(a.ts)}</div>
    <div class="bd">${body(a.body)}</div></div>`;return;
  }
  let L=items.filter(i=>(sec==='الكل'||i.section===sec)&&(!q||(i.title+i.body).includes(q)));
  if(!L.length){v.innerHTML='<div class="empty">لا توجد أخبار.</div>';return}
  const showSl=sec==='الكل'&&!q;
  v.innerHTML=(showSl?slide():'')+`<div class="sec">${showSl?'أهم الأخبار':esc(q?'نتائج البحث':sec)}</div>`+
  L.map((i,k)=>k==0?`<div class="big" data-go="${esc(i.id)}">${i.img?`<img src="${src(i)}" alt="">`:''}<h3>${esc(i.title)}</h3><div class="meta" style="margin:0 14px 10px">${fd(i.ts)}${i.breaking?'<span class="tag">عاجل</span>':''}</div></div>${del(i)}`:
  `<div class="row" data-go="${esc(i.id)}">${i.img?`<img src="${src(i)}" alt="">`:''}<div class="t"><h3>${esc(i.title)}</h3><div class="meta">${fd(i.ts)}</div></div></div>${del(i)}`).join('');
  if(showSl)timer=setInterval(()=>{si++;render()},6000);
}
$('view').onclick=async e=>{
  const d=e.target.closest('[data-del]');
  if(d){e.stopPropagation();if(confirm('حذف هذا الخبر؟'))try{await api({action:'delete',id:d.dataset.del});await load()}catch(x){alert('تعذر الحذف')}return}
  const ar=e.target.closest('[data-d]');if(ar){si+=+ar.dataset.d;if(si<0)si=3;render();return}
  const dt=e.target.closest('[data-k]');if(dt){si=+dt.dataset.k;render();return}
  const g=e.target.closest('[data-go]');if(g)location.hash=g.dataset.go;
};
const SB='https://wupqqyhevlxqllnagtdl.supabase.co',KEY='sb_publishable_LUddIUeSAGfiHXTF95h28Q_1HmF3F_E';
async function load(){
  try{
    const r=await fetch(SB+'/rest/v1/news?select=*&order=created_at.desc&limit=100',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(!r.ok)throw 0;
    items=(await r.json()).map(x=>({id:x.id,title:x.title,body:x.body,section:x.section,author:x.author,img:x.image_url,cap:x.caption,breaking:x.breaking,ts:Date.parse(x.created_at)}));
    render();
  }catch(e){if(!items.length)$('view').innerHTML='<div class="empty">تعذر تحميل الأخبار.</div>'}
}
const API=SB+'/functions/v1/admin';let CODE='';
async function api(o){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({code:CODE,...o})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'حدث خطأ');
  return j;
}
$('sc').innerHTML=SECS.slice(1).map(x=>`<option>${x}</option>`).join('');
function shrink(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>rej(new Error('تعذر قراءة الصورة'));im.src=URL.createObjectURL(f)})}
$('adm').onclick=()=>{
  adminOpen=!adminOpen;
  $('admin').style.display=adminOpen?'block':'none';
  $('adm').textContent=adminOpen?'إغلاق لوحة الأدمن':'أدمن';
  render();if(adminOpen)scrollTo({top:0,behavior:'smooth'});
};
async function login(){
  CODE=$('ac').value.trim();$('ast').textContent='جاري التحقق...';
  try{await api({action:'check'});isAdmin=true;$('alogin').style.display='none';$('afm').style.display='block';$('ast').textContent='';render()}
  catch(e){CODE='';$('ast').textContent=e.message}
}
$('ago').onclick=login;
$('ac').onkeydown=e=>{if(e.key==='Enter')login()};
$('f').onchange=e=>{file=e.target.files[0]||null;if(file){$('prev').src=URL.createObjectURL(file);$('prev').style.display='block'}else $('prev').style.display='none'};
$('pub').onclick=async()=>{
  const title=$('t').value.trim(),b=$('b').value.trim();
  if(!title||!b){$('st').textContent='اكتب العنوان والمقال.';return}
  $('pub').disabled=true;$('st').textContent='جاري النشر...';
  try{
    const image=file?await shrink(file):null;
    await api({action:'publish',title,body:b,image,section:$('sc').value,author:$('au').value.trim(),caption:$('cap').value.trim(),breaking:$('br').checked});
    ['t','b','cap','au','f'].forEach(k=>$(k).value='');file=null;$('prev').style.display='none';
    $('st').textContent='تم النشر بنجاح';await load();
  }catch(e){$('st').textContent='تعذر النشر: '+e.message}
  $('pub').disabled=false;
};
load();setInterval(load,60000);
</script>
