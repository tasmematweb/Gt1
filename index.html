<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال وبحث في جوجل شيت - مع الصور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { width: 100%; max-width: 600px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #0d6efd; border: none; padding: 12px; font-weight: bold; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-success { background-color: #198754; border: none; padding: 12px; font-weight: bold; }
        .btn-success:hover { background-color: #157347; }
        .btn-warning { background-color: #ffc107; border: none; padding: 12px; font-weight: bold; color: #000; }
        .btn-warning:hover { background-color: #ffca2c; }
        .btn-danger { background-color: #dc3545; border: none; padding: 12px; font-weight: bold; }
        .btn-danger:hover { background-color: #c82333; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,0.25); }
        .alert { margin-top: 20px; }
        .search-result { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 10px; 
            margin-top: 15px; 
            border: 2px solid #28a745;
            box-shadow: 0 2px 10px rgba(40,167,69,0.1);
        }
        .search-result .label { 
            font-weight: bold; 
            color: #495057; 
            display: inline-block;
            width: 80px;
        }
        .search-result .value { 
            color: #212529; 
            font-size: 1.1em;
            font-weight: 500;
        }
        .search-result .row-item {
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .search-result .row-item:last-child {
            border-bottom: none;
        }
        .divider { border-top: 2px dashed #dee2e6; margin: 25px 0; }
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            margin-top: 10px;
            object-fit: cover;
        }
        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 10px;
        }
        .image-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .upload-btn {
            width: 100%;
        }
        .image-result {
            max-width: 150px;
            max-height: 150px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            object-fit: cover;
            margin-top: 10px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .log-box {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            border: 2px solid #333;
        }
        .log-box .log-error { color: #ff4444; }
        .log-box .log-success { color: #44ff44; }
        .log-box .log-info { color: #44aaff; }
        .log-box .log-warning { color: #ffaa44; }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .log-header h6 { margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <h3 class="text-center mb-4">📤 إرسال وبحث في جوجل شيت</h3>
        
        <h5 class="mb-3">➕ إضافة بيانات جديدة مع صورة</h5>
        <form id="sheetForm">
            <div class="mb-3">
                <label for="name" class="form-label">الاسم</label>
                <input type="text" class="form-control" id="name" placeholder="أدخل الاسم" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">رقم الهاتف</label>
                <input type="tel" class="form-control" id="phone" placeholder="مثال: 05xxxxxxxx" required>
            </div>
            <div class="mb-4">
                <label for="image" class="form-label">الصورة</label>
                <div class="file-input-wrapper">
                    <button type="button" class="btn btn-warning upload-btn">📷 اختر صورة من المعرض</button>
                    <input type="file" class="form-control" id="image" accept="image/*" capture="environment">
                </div>
                <div class="preview-container">
                    <img id="imagePreview" class="image-preview d-none" alt="معاينة الصورة">
                    <div class="image-actions">
                        <button type="button" class="btn btn-danger btn-sm d-none" id="removeImageBtn">❌ إزالة الصورة</button>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">إرسال</button>
        </form>
        <div id="responseMessage" class="alert d-none" role="alert"></div>

        <div class="divider"></div>

        <h5 class="mb-3">🔍 البحث عن بيانات</h5>
        <div class="mb-3">
            <label for="searchPhone" class="form-label">أدخل رقم الهاتف للبحث</label>
            <div class="input-group">
                <input type="tel" class="form-control" id="searchPhone" placeholder="مثال: 05xxxxxxxx">
                <button class="btn btn-success" id="searchBtn" type="button">بحث</button>
            </div>
        </div>
        
        <div id="searchResult" class="search-result d-none">
            <h6 class="text-success mb-3">✅ تم العثور على البيانات</h6>
            <div class="row-item">
                <span class="label">👤 الاسم:</span>
                <span class="value" id="resultName">-</span>
            </div>
            <div class="row-item">
                <span class="label">📱 الهاتف:</span>
                <span class="value" id="resultPhone">-</span>
            </div>
            <div class="row-item">
                <span class="label">🖼️ الصورة:</span>
                <div id="resultImageContainer"></div>
            </div>
        </div>
        
        <div id="searchMessage" class="alert d-none" role="alert"></div>

        <!-- قسم السجلات -->
        <div class="log-header">
            <h6 class="text-muted">📋 سجل الأخطاء والتشغيل</h6>
            <button class="btn btn-sm btn-outline-secondary" id="clearLogBtn">مسح</button>
        </div>
        <div class="log-box" id="logBox">
            <div class="log-info">⏳ جاهز...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // رابط التطبيق الجديد
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQA0ePo4DdjNZXgxDX8LnaT5Yc5XhAetb3DTPVrk19MVbILnpEGoQHCVv1O4ZVUh0o/exec';

        // عناصر السجلات
        const logBox = document.getElementById('logBox');
        const clearLogBtn = document.getElementById('clearLogBtn');

        // دالة إضافة سجل
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-${type}`;
            entry.textContent = `[${time}] ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // مسح السجلات
        clearLogBtn.addEventListener('click', function() {
            logBox.innerHTML = '';
            addLog('🗑️ تم مسح السجلات', 'info');
        });

        // عناصر الإرسال
        const form = document.getElementById('sheetForm');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const imageInput = document.getElementById('image');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const submitBtn = document.getElementById('submitBtn');
        const responseMsg = document.getElementById('responseMessage');

        // عناصر البحث
        const searchPhoneInput = document.getElementById('searchPhone');
        const searchBtn = document.getElementById('searchBtn');
        const searchResult = document.getElementById('searchResult');
        const resultName = document.getElementById('resultName');
        const resultPhone = document.getElementById('resultPhone');
        const resultImageContainer = document.getElementById('resultImageContainer');
        const searchMessage = document.getElementById('searchMessage');

        addLog('✅ تم تحميل الصفحة بنجاح', 'success');
        addLog(`🔗 رابط التطبيق: ${SCRIPT_URL}`, 'info');

        // معاينة الصورة
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                addLog(`📷 تم اختيار صورة: ${file.name} (${(file.size/1024).toFixed(1)} KB)`, 'info');
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('d-none');
                    removeImageBtn.classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            } else {
                addLog('❌ لم يتم اختيار صورة', 'warning');
                imagePreview.classList.add('d-none');
                removeImageBtn.classList.add('d-none');
            }
        });

        removeImageBtn.addEventListener('click', function() {
            imageInput.value = '';
            imagePreview.classList.add('d-none');
            imagePreview.src = '';
            removeImageBtn.classList.add('d-none');
            addLog('🗑️ تم إزالة الصورة', 'info');
        });

        function showMessage(text, type = 'success') {
            responseMsg.textContent = text;
            responseMsg.className = `alert alert-${type} d-block`;
        }

        function showSearchMessage(text, type = 'success') {
            searchMessage.textContent = text;
            searchMessage.className = `alert alert-${type} d-block`;
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.innerHTML = loading ? 
                '<span class="loading-spinner"></span> جاري الإرسال...' : 
                'إرسال';
        }

        function setSearchLoading(loading) {
            searchBtn.disabled = loading;
            searchBtn.innerHTML = loading ? 
                '<span class="loading-spinner"></span> جاري البحث...' : 
                'بحث';
        }

        function getImageBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // ========== إرسال البيانات ==========
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const imageFile = imageInput.files[0];

            addLog('📤 بدء عملية الإرسال...', 'info');
            addLog(`👤 الاسم: ${name}`, 'info');
            addLog(`📱 الهاتف: ${phone}`, 'info');

            if (!name || !phone) {
                addLog('⚠️ الرجاء ملء جميع الحقول', 'warning');
                showMessage('⚠️ الرجاء ملء جميع الحقول', 'warning');
                return;
            }

            setLoading(true);
            responseMsg.className = 'alert d-none';

            try {
                let imageBase64 = '';
                if (imageFile) {
                    addLog('🔄 جاري تحويل الصورة إلى Base64...', 'info');
                    imageBase64 = await getImageBase64(imageFile);
                    addLog(`✅ تم تحويل الصورة (${(imageBase64.length/1024).toFixed(1)} KB)`, 'success');
                } else {
                    addLog('ℹ️ لم يتم اختيار صورة', 'info');
                }

                const payload = { name, phone, image: imageBase64 };
                addLog('📡 جاري إرسال البيانات إلى الخادم...', 'info');

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                addLog(`📡 استجابة الخادم: ${response.status} ${response.statusText}`, 'info');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                addLog(`📦 بيانات الاستجابة: ${JSON.stringify(result)}`, 'info');

                if (result.success) {
                    addLog(`✅ تم الإرسال بنجاح! رابط الصورة: ${result.imageUrl || 'لا توجد صورة'}`, 'success');
                    showMessage('✅ تم إرسال البيانات بنجاح!', 'success');
                    form.reset();
                    imagePreview.classList.add('d-none');
                    imagePreview.src = '';
                    removeImageBtn.classList.add('d-none');
                } else {
                    addLog(`❌ فشل الإرسال: ${result.error}`, 'error');
                    showMessage(`❌ حدث خطأ: ${result.error}`, 'danger');
                }

            } catch (error) {
                addLog(`❌ خطأ: ${error.message}`, 'error');
                console.error('خطأ في الإرسال:', error);
                showMessage('❌ حدث خطأ أثناء الإرسال.', 'danger');
            } finally {
                setLoading(false);
                addLog('🏁 انتهت عملية الإرسال', 'info');
            }
        });

        // ========== البحث عن البيانات ==========
        searchBtn.addEventListener('click', async function() {
            const phone = searchPhoneInput.value.trim();

            addLog('🔍 بدء عملية البحث...', 'info');
            addLog(`📱 رقم الهاتف المطلوب: ${phone}`, 'info');

            if (!phone) {
                addLog('⚠️ الرجاء إدخال رقم هاتف للبحث', 'warning');
                showSearchMessage('⚠️ الرجاء إدخال رقم هاتف للبحث', 'warning');
                searchResult.classList.add('d-none');
                return;
            }

            searchResult.classList.add('d-none');
            searchMessage.className = 'alert d-none';
            setSearchLoading(true);

            try {
                const url = `${SCRIPT_URL}?phone=${encodeURIComponent(phone)}`;
                addLog(`📡 جاري البحث عبر: ${url}`, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors'
                });

                addLog(`📡 استجابة الخادم: ${response.status} ${response.statusText}`, 'info');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                addLog(`📦 بيانات الاستجابة: ${JSON.stringify(data)}`, 'info');

                if (data.found) {
                    addLog(`✅ تم العثور على البيانات: ${data.name}`, 'success');
                    resultName.textContent = data.name || 'غير معروف';
                    resultPhone.textContent = data.phone || 'غير معروف';
                    
                    resultImageContainer.innerHTML = '';
                    if (data.image && data.image.startsWith('http')) {
                        addLog(`🖼️ رابط الصورة: ${data.image}`, 'info');
                        const img = document.createElement('img');
                        img.src = data.image;
                        img.className = 'image-result';
                        img.alt = 'صورة المستخدم';
                        img.onload = function() {
                            addLog('✅ تم تحميل الصورة بنجاح', 'success');
                        };
                        img.onerror = function() {
                            this.style.display = 'none';
                            resultImageContainer.innerHTML = '<span class="text-muted">⚠️ تعذر تحميل الصورة</span>';
                            addLog('⚠️ تعذر تحميل الصورة', 'warning');
                        };
                        resultImageContainer.appendChild(img);
                    } else {
                        addLog('ℹ️ لا توجد صورة', 'info');
                        resultImageContainer.innerHTML = '<span class="text-muted">لا توجد صورة</span>';
                    }
                    
                    searchResult.classList.remove('d-none');
                    searchMessage.className = 'alert d-none';
                } else {
                    addLog(`❌ لم يتم العثور على رقم الهاتف: ${data.message}`, 'error');
                    showSearchMessage(`❌ ${data.message || 'لم يتم العثور على رقم الهاتف'}`, 'danger');
                    searchResult.classList.add('d-none');
                }

            } catch (error) {
                addLog(`❌ خطأ: ${error.message}`, 'error');
                console.error('خطأ في البحث:', error);
                showSearchMessage('❌ حدث خطأ أثناء البحث. تأكد من الرابط.', 'danger');
                searchResult.classList.add('d-none');
            } finally {
                setSearchLoading(false);
                addLog('🏁 انتهت عملية البحث', 'info');
            }
        });

        searchPhoneInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        // إضافة سجل عند تحميل الصفحة
        addLog('🚀 الموقع جاهز للاستخدام', 'success');

    })();
</script>

</body>
</html>
