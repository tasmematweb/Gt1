<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance Luxury Neon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.05) 0%, rgba(255, 183, 0, 0.03) 50%, #ffffff 100%);
            height: 550vh;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
            color: #0f172a;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #0088cc;
            margin-bottom: 15px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #ffb700;
            border-radius: 50%;
        }

        /* تسريع العتاد للأقسام الرئيسية */
        .hanging-wrapper, .archer-section, .chart-section {
            will-change: transform;
            contain: content;
        }

        /* ---------------- 1. الساعة المعلقة ---------------- */
        .hanging-wrapper {
            position: absolute;
            top: 50vh;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 90%;
            max-width: 520px;
        }

        .wall-nail {
            width: clamp(14px, 2.5vw, 20px);
            height: clamp(14px, 2.5vw, 20px);
            background: #ffb700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffb700;
            margin-bottom: -2px;
            z-index: 2;
        }

        .hanging-string {
            width: 3px;
            height: clamp(40px, 8vh, 70px);
            background: linear-gradient(to bottom, #ffb700, #00d2ff);
        }

        .clock-frame-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: clamp(2px, 0.5vw, 3px) solid #00d2ff;
            border-radius: clamp(24px, 4vw, 36px);
            padding: clamp(20px, 4vw, 35px);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-container {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
        }

        /* ---------------- 2. قسم الرامي ---------------- */
        .archer-section {
            position: absolute;
            top: 200vh;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 980px;
            background: rgba(255, 255, 255, 0.95);
            border: clamp(2px, 0.5vw, 3px) solid #00d2ff;
            border-radius: clamp(24px, 4vw, 36px);
            padding: clamp(18px, 3vw, 30px);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .archer-container {
            width: 100%;
            aspect-ratio: 800 / 400;
        }

        /* ---------------- 3. قسم الرسم البياني ---------------- */
        .chart-section {
            position: absolute;
            top: 360vh;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            border: clamp(2px, 0.5vw, 3px) solid #00d2ff;
            border-radius: clamp(24px, 4vw, 36px);
            padding: clamp(18px, 3vw, 30px);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-container {
            width: 100%;
            aspect-ratio: 800 / 420;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
        }

        /* تحسين التوهج خفيف الأداء */
        .neon-blue { filter: drop-shadow(0 0 4px #00d2ff); }
        .neon-gold { filter: drop-shadow(0 0 4px #ffb700); }

        @media (max-width: 600px) {
            body { height: 480vh; }
            .archer-section { top: 170vh; }
            .chart-section { top: 310vh; }
        }
    </style>
</head>
<body>

    <!-- 1. الساعة -->
    <div class="hanging-wrapper">
        <div class="wall-nail"></div>
        <div class="hanging-string"></div>
        <div class="clock-frame-box">
            <div class="section-badge"><span class="badge-dot"></span> precision timepiece</div>
            <div class="clock-container">
                <svg viewBox="-70 -70 440 440">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffe600" />
                            <stop offset="100%" stop-color="#ff9900" />
                        </linearGradient>
                        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffff" />
                            <stop offset="100%" stop-color="#0088ff" />
                        </linearGradient>
                    </defs>

                    <circle cx="150" cy="150" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
                    <circle cx="150" cy="150" r="135" fill="none" stroke="url(#blueGrad)" stroke-width="3.5" class="neon-blue" />
                    <g id="ticks" stroke-linecap="round"></g>

                    <g id="hour-hand" transform="rotate(295 150 150)">
                        <polygon points="146,150 154,150 151,80 149,80" fill="url(#goldGrad)" class="neon-gold" />
                    </g>
                    <g id="minute-hand" transform="rotate(355 150 150)">
                        <line x1="150" y1="185" x2="150" y2="35" stroke="url(#blueGrad)" stroke-width="4.5" stroke-linecap="round" class="neon-blue" />
                    </g>
                    <circle cx="150" cy="150" r="8" fill="#00d2ff" />
                    <circle cx="150" cy="150" r="4" fill="#ffe600" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 2. الرامي -->
    <div class="archer-section">
        <div class="section-badge"><span class="badge-dot"></span> accuracy & precision</div>
        <div class="archer-container">
            <svg viewBox="0 0 800 400">
                <line x1="30" y1="340" x2="770" y2="340" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" />

                <g id="stickman" class="neon-blue">
                    <g id="quiver-group">
                        <path d="M 98,170 L 112,230 L 102,232 L 88,172 Z" fill="rgba(255, 183, 0, 0.2)" stroke="#ffb700" stroke-width="2" />
                        <line id="q-arrow-3" x1="91" y1="171" x2="82" y2="150" stroke="#ffb700" stroke-width="3" stroke-linecap="round" />
                        <line id="q-arrow-2" x1="95" y1="171" x2="89" y2="145" stroke="#ffb700" stroke-width="3" stroke-linecap="round" />
                        <line id="q-arrow-1" x1="99" y1="171" x2="96" y2="140" stroke="#ffb700" stroke-width="3" stroke-linecap="round" />
                    </g>
                    <circle cx="120" cy="140" r="22" fill="#00d2ff" stroke="url(#goldGrad)" stroke-width="2.5" />
                    <line x1="95" y1="135" x2="145" y2="135" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
                    <line x1="120" y1="162" x2="120" y2="250" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="90" y2="340" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="150" y2="340" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="180" x2="175" y2="185" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M 175,120 Q 205,185 175,250" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
                    <path id="bow-string" d="M 175,120 L 175,185 L 175,250" fill="none" stroke="#00d2ff" stroke-width="2" />
                </g>

                <g id="arrows-container">
                    <g id="arrow-1" style="opacity: 0;">
                        <line x1="130" y1="176" x2="195" y2="176" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" />
                        <polygon points="195,170 212,176 195,182" fill="#ffb700" />
                    </g>
                    <g id="arrow-2" style="opacity: 0;">
                        <line x1="130" y1="185" x2="195" y2="185" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                        <polygon points="195,179 212,185 195,191" fill="#ffb700" />
                    </g>
                    <g id="arrow-3" style="opacity: 0;">
                        <line x1="130" y1="194" x2="195" y2="194" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" />
                        <polygon points="195,188 212,194 195,200" fill="#ffb700" />
                    </g>
                </g>

                <g id="target-board">
                    <line x1="680" y1="220" x2="630" y2="340" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="730" y2="340" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="680" y2="340" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
                    <circle cx="680" cy="185" r="55" fill="none" stroke="#00d2ff" stroke-width="3.5" stroke-dasharray="6,4" />
                    <circle cx="680" cy="185" r="38" fill="none" stroke="#00d2ff" stroke-width="3" />
                    <circle cx="680" cy="185" r="22" fill="none" stroke="#ffb700" stroke-width="3" />
                    <circle cx="680" cy="185" r="9" fill="url(#goldGrad)" />
                </g>
            </svg>
        </div>
    </div>

    <!-- 3. الرسم البياني -->
    <div class="chart-section">
        <div class="section-badge"><span class="badge-dot"></span> exponential growth</div>
        <div class="chart-container">
            <svg viewBox="0 0 800 420">
                <defs>
                    <pattern id="lux-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 210, 255, 0.15)" stroke-width="1.2" />
                    </pattern>
                    <linearGradient id="chartLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00d2ff" />
                        <stop offset="100%" stop-color="#ffb700" />
                    </linearGradient>
                </defs>

                <rect x="15" y="15" width="770" height="390" rx="20" fill="url(#lux-grid)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="2" stroke-dasharray="8,6" />

                <path id="chart-path" 
                      d="M 50 370 L 110 325 L 135 340 L 200 270 L 235 295 L 310 195 L 345 220 L 440 115 L 475 140 L 560 55 L 595 80 L 710 25" 
                      fill="none" 
                      stroke="url(#chartLineGrad)" 
                      stroke-width="7" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" />

                <g id="chart-arrow-head" class="neon-gold">
                    <path d="M 0 0 L -28 -14 L -20 0 L -28 14 Z" fill="url(#goldGrad)" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        // رسم الشُرط مرة واحدة
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", isMajor ? "33" : "26");
            line.setAttribute("stroke-width", isMajor ? "3.5" : "1.5");
            line.setAttribute("stroke", isMajor ? "#ffb700" : "#00d2ff");
            line.setAttribute("transform", `rotate(${angle} 150 150)`);
            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        const archerSection = document.querySelector('.archer-section');
        const bowString = document.getElementById('bow-string');
        const targetBoard = document.getElementById('target-board');
        const qArrow1 = document.getElementById('q-arrow-1');
        const qArrow2 = document.getElementById('q-arrow-2');
        const qArrow3 = document.getElementById('q-arrow-3');
        const arrow1 = document.getElementById('arrow-1');
        const arrow2 = document.getElementById('arrow-2');
        const arrow3 = document.getElementById('arrow-3');

        const chartSection = document.querySelector('.chart-section');
        const chartPath = document.getElementById('chart-path');
        const chartArrowHead = document.getElementById('chart-arrow-head');
        const totalChartLength = chartPath.getTotalLength();

        chartPath.style.strokeDasharray = totalChartLength;
        chartPath.style.strokeDashoffset = totalChartLength;

        // تخزين المواضع لتجنب Layout Thrashing
        let archerTop = 0, chartTop = 0, winHeight = window.innerHeight;

        function updatePositions() {
            winHeight = window.innerHeight;
            archerTop = archerSection.offsetTop;
            chartTop = chartSection.offsetTop;
        }
        window.addEventListener('resize', updatePositions);
        updatePositions();

        let currentArcherP = 0, currentChartP = 0;

        function getShotState(progress, start, end) {
            if (progress < start) return { phase: 'waiting', p: 0 };
            if (progress >= end) return { phase: 'done', p: 1 };
            return { phase: 'active', p: (progress - start) / (end - start) };
        }

        function animate() {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - winHeight;
            const scrollFraction = maxScroll > 0 ? Math.min(Math.max(scrollTop / maxScroll, 0), 1) : 0;

            // 1. الساعة
            minuteHand.setAttribute('transform', `rotate(${355 + (scrollFraction * 4320)} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${295 + (scrollFraction * 360)} 150 150)`);

            // 2. الرامي (بدون قراءة DOM داخل الحلقة)
            const archerStart = archerTop - winHeight * 0.85;
            const archerEnd = archerTop - winHeight * 0.15;
            let rawArcherP = (scrollTop - archerStart) / (archerEnd - archerStart);
            rawArcherP = Math.min(Math.max(rawArcherP, 0), 1);
            currentArcherP += (rawArcherP - currentArcherP) * 0.15;

            const s1 = getShotState(currentArcherP, 0.00, 0.33);
            const s2 = getShotState(currentArcherP, 0.33, 0.66);
            const s3 = getShotState(currentArcherP, 0.66, 1.00);

            qArrow1.style.opacity = s1.phase === 'waiting' ? '1' : '0';
            qArrow2.style.opacity = s2.phase === 'waiting' ? '1' : '0';
            qArrow3.style.opacity = s3.phase === 'waiting' ? '1' : '0';

            let currentBowPull = 0;
            let targetHitImpact = false;
            const shots = [s1, s2, s3], arrows = [arrow1, arrow2, arrow3];

            shots.forEach((s, idx) => {
                const arrow = arrows[idx];
                if (s.phase === 'waiting') {
                    arrow.style.opacity = '0';
                } else if (s.phase === 'active') {
                    arrow.style.opacity = '1';
                    if (s.p < 0.25) {
                        let pull = (s.p / 0.25) * 28;
                        currentBowPull = pull;
                        arrow.setAttribute('transform', `translate(${-pull}, 0)`);
                    } else {
                        let flightP = (s.p - 0.25) / 0.75;
                        let currentX = -30 + (flightP * 515);
                        arrow.setAttribute('transform', `translate(${currentX}, 0)`);
                        if (flightP >= 0.88) targetHitImpact = true;
                    }
                } else {
                    arrow.style.opacity = '1';
                    arrow.setAttribute('transform', `translate(485, 0)`);
                }
            });

            bowString.setAttribute('d', `M 175,120 L ${175 - currentBowPull},185 L 175,250`);
            targetBoard.setAttribute('transform', targetHitImpact ? `translate(6, 0)` : `translate(0, 0)`);

            // 3. الرسم البياني (بدون قراءة DOM داخل الحلقة)
            const chartStart = chartTop - winHeight * 0.85;
            const chartEnd = chartTop - winHeight * 0.20;
            let rawChartP = (scrollTop - chartStart) / (chartEnd - chartStart);
            rawChartP = Math.min(Math.max(rawChartP, 0), 1);
            currentChartP += (rawChartP - currentChartP) * 0.15;

            const drawLength = currentChartP * totalChartLength;
            chartPath.style.strokeDashoffset = totalChartLength - drawLength;

            if (drawLength > 0.5) {
                chartArrowHead.style.opacity = '1';
                const pt = chartPath.getPointAtLength(drawLength);
                const ptPrev = chartPath.getPointAtLength(Math.max(0, drawLength - 3));
                const angle = Math.atan2(pt.y - ptPrev.y, pt.x - ptPrev.x) * (180 / Math.PI);
                chartArrowHead.setAttribute('transform', `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
            } else {
                chartArrowHead.style.opacity = '0';
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
