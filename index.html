<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tasmematweb | تصميم وتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07040d;
            --primary-purple: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.5);
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
        }

        /* 1. خلفية محاكاة التموج المائي ASCII Canvas */
        #ascii-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; /* للسماح بالضغط على العناصر فوقه */
        }

        /* 2. المحتوى فوق الخلفية */
        .page-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(7, 4, 13, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 3D Letter Swap Logo */
        .logo-3d-swap {
            display: inline-flex;
            direction: ltr;
            perspective: 1000px;
            cursor: pointer;
        }

        .letter-box {
            display: inline-block;
            position: relative;
            width: 18px;
            height: 35px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.6rem;
            font-weight: 800;
        }

        .logo-3d-swap:hover .letter-box,
        .logo-3d-swap.active .letter-box {
            transform: rotateX(360deg);
        }

        /* إعطاء تأخير زمني متتابع لكل حرف لتأثير احترافي */
        .letter-box:nth-child(1) { transition-delay: 0.05s; }
        .letter-box:nth-child(2) { transition-delay: 0.10s; }
        .letter-box:nth-child(3) { transition-delay: 0.15s; }
        .letter-box:nth-child(4) { transition-delay: 0.20s; }
        .letter-box:nth-child(5) { transition-delay: 0.25s; }
        .letter-box:nth-child(6) { transition-delay: 0.30s; }
        .letter-box:nth-child(7) { transition-delay: 0.35s; }
        .letter-box:nth-child(8) { transition-delay: 0.40s; }
        .letter-box:nth-child(9) { transition-delay: 0.45s; }
        .letter-box:nth-child(10) { transition-delay: 0.50s; }
        .letter-box:nth-child(11) { transition-delay: 0.55s; }

        .letter-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: linear-gradient(135deg, var(--primary-purple), #7e22ce);
            color: #fff;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.7);
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 8%;
            max-width: 900px;
            margin: 0 auto;
        }

        .badge {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(2.3rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
            line-height: 1.7;
            max-width: 650px;
            margin-bottom: 35px;
        }

        .cta-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-purple), #6b21a8);
            color: #fff;
            padding: 14px 36px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 25px var(--primary-glow);
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
        }

        .hint-touch {
            margin-top: 40px;
            font-size: 0.85rem;
            color: rgba(168, 85, 247, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- خلفية محاكاة ASCII Ripple -->
    <canvas id="ascii-canvas"></canvas>

    <!-- واجهة الموقع -->
    <div class="page-wrapper">
        <nav>
            <!-- الشعار مع تأثير 3D Letter Swap عند التمرير أو الضغط -->
            <div class="logo-3d-swap" id="logo3d">
                <span class="letter-box"><span class="letter-face">t</span></span>
                <span class="letter-box"><span class="letter-face">a</span></span>
                <span class="letter-box"><span class="letter-face">s</span></span>
                <span class="letter-box"><span class="letter-face">m</span></span>
                <span class="letter-box"><span class="letter-face">e</span></span>
                <span class="letter-box"><span class="letter-face">m</span></span>
                <span class="letter-box"><span class="letter-face">a</span></span>
                <span class="letter-box"><span class="letter-face">t</span></span>
                <span class="letter-box"><span class="letter-face">w</span></span>
                <span class="letter-box"><span class="letter-face">e</span></span>
                <span class="letter-box"><span class="letter-face">b</span></span>
            </div>

            <a href="https://instagram.com/tasmematweb" target="_blank" class="nav-btn">تواصل معنا</a>
        </nav>

        <section class="hero">
            <div class="badge">✨ تصميم وتطوير مواقع وتطبيقات عصرية</div>
            <h1>نُحول أفكارك الرقمية إلى <span style="color: var(--primary-purple);">واقع ملموس</span></h1>
            <p>نقدم لك حلولاً برمجية متكاملة بأحدث واجهات المستخدم مع أداء فائق السرعة وخبرة متميزة.</p>

            <div class="cta-group">
                <a href="https://instagram.com/tasmematweb" target="_blank" class="btn-primary">ابدأ مشروعك الآن ←</a>
            </div>

            <div class="hint-touch">
                <span>👆 المس أو اسحب إصبعك على الشاشة لرؤية التأثير المائي</span>
            </div>
        </section>
    </div>

    <!-- كود محاكاة السوائل والتموج المائي ASCII Ripple -->
    <script>
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, cols, rows;
        const charW = 10, charH = 16;
        let buffer1 = [], buffer2 = [];
        const damping = 0.95; // معامل التلاشي للموجة

        const glyphs = "·.,:;-~=+*%#@";
        const passage = "tasmematweb create your future web SaaS digital apps responsive design ";

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cols = Math.ceil(width / charW);
            rows = Math.ceil(height / charH);
            
            const size = cols * rows;
            buffer1 = new Float32Array(size);
            buffer2 = new Float32Array(size);
        }

        window.addEventListener('resize', resize);
        resize();

        // إضافة طاقة التموج المائي عند موقع اللمس أو حركة الماوس
        function triggerRipple(x, y, radius = 3, strength = 4) {
            const cx = Math.floor(x / charW);
            const cy = Math.floor(y / charH);

            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const rx = cx + dx;
                    const ry = cy + dy;
                    if (rx >= 0 && rx < cols && ry >= 0 && ry < rows) {
                        if (dx * dx + dy * dy <= radius * radius) {
                            buffer1[ry * cols + rx] += strength;
                        }
                    }
                }
            }
        }

        // الاستماع للأحداث (اللمس على الموبايل وحركة الماوس)
        window.addEventListener('pointermove', (e) => triggerRipple(e.clientX, e.clientY, 3, 2));
        window.addEventListener('pointerdown', (e) => triggerRipple(e.clientX, e.clientY, 5, 8));
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) triggerRipple(e.touches[0].clientX, e.touches[0].clientY, 4, 3);
        });

        // حلقة التحديث والفيزياء المائية
        function updateSimulation() {
            for (let y = 1; y < rows - 1; y++) {
                for (let x = 1; x < cols - 1; x++) {
                    const idx = y * cols + x;
                    buffer2[idx] = (
                        buffer1[idx - 1] +
                        buffer1[idx + 1] +
                        buffer1[idx - cols] +
                        buffer1[idx + cols]
                    ) / 2 - buffer2[idx];
                    buffer2[idx] *= damping;
                }
            }
            // تبديل البفرين
            const temp = buffer1;
            buffer1 = buffer2;
            buffer2 = temp;
        }

        // رسم الحروف والتموجات النيون
        function render() {
            ctx.fillStyle = "#07040d";
            ctx.fillRect(0, 0, width, height);

            ctx.font = '12px "Fira Code", monospace';

            let passageIdx = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = y * cols + x;
                    const val = buffer1[idx];
                    const absVal = Math.abs(val);

                    let char = passage[passageIdx % passage.length];
                    passageIdx++;

                    if (absVal > 0.08) {
                        // تحويل قوة الموجة إلى أحد محارف ASCII وتوهج بنفسجي/أبيض
                        const gIdx = Math.min(glyphs.length - 1, Math.floor(absVal * (glyphs.length - 1)));
                        char = glyphs[gIdx];

                        const alpha = Math.min(1, absVal * 0.8);
                        if (val > 0.4) {
                            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        } else {
                            ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`;
                        }
                    } else {
                        // حالة السكون (حروف بنفسجية خافتة في الخلفية)
                        ctx.fillStyle = "rgba(168, 85, 247, 0.12)";
                    }

                    ctx.fillText(char, x * charW, y * charH + 12);
                }
            }
        }

        function loop() {
            updateSimulation();
            render();
            requestAnimationFrame(loop);
        }
        loop();

        // تفعيل حركة الشعار عند الضغط
        const logo = document.getElementById('logo3d');
        logo.addEventListener('click', () => {
            logo.classList.add('active');
            setTimeout(() => logo.classList.remove('active'), 1200);
        });
    </script>
</body>
</html>
